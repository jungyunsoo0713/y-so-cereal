name: Deploy to ECS

on:
  push:
    branches: [main]
    paths:
      - "src/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "ap-northeast-2"
  ECS_CLUSTER: "y-so-cereal-dev-cluster"

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      cart:     ${{ steps.filter.outputs.cart }}
      catalog:  ${{ steps.filter.outputs.catalog }}
      checkout: ${{ steps.filter.outputs.checkout }}
      orders:   ${{ steps.filter.outputs.orders }}
      ui:       ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cart:
              - 'src/cart/**'
            catalog:
              - 'src/catalog/**'
            checkout:
              - 'src/checkout/**'
            orders:
              - 'src/orders/**'
            ui:
              - 'src/ui/**'

  deploy:
    name: Build & Deploy - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: changes
    environment: production

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: cart
            enabled: ${{ needs.changes.outputs.cart == 'true' }}
          - service: catalog
            enabled: ${{ needs.changes.outputs.catalog == 'true' }}
          - service: checkout
            enabled: ${{ needs.changes.outputs.checkout == 'true' }}
          - service: orders
            enabled: ${{ needs.changes.outputs.orders == 'true' }}
          - service: ui
            enabled: ${{ needs.changes.outputs.ui == 'true' }}

    if: |
      needs.changes.outputs.cart == 'true' ||
      needs.changes.outputs.catalog == 'true' ||
      needs.changes.outputs.checkout == 'true' ||
      needs.changes.outputs.orders == 'true' ||
      needs.changes.outputs.ui == 'true'

    steps:
      - name: Skip if service not changed
        if: matrix.enabled != 'true'
        run: echo "No changes in ${{ matrix.service }}, skipping."

      - name: Checkout
        if: matrix.enabled == 'true'
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        if: matrix.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Deploy-${{ matrix.service }}

      - name: Login to Amazon ECR
        if: matrix.enabled == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        if: matrix.enabled == 'true'
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          docker build \
            -t $ECR_REGISTRY/y-so-cereal-dev-${SERVICE}:${IMAGE_TAG} \
            -t $ECR_REGISTRY/y-so-cereal-dev-${SERVICE}:latest \
            src/${SERVICE}
          docker push $ECR_REGISTRY/y-so-cereal-dev-${SERVICE}:${IMAGE_TAG}
          docker push $ECR_REGISTRY/y-so-cereal-dev-${SERVICE}:latest
          echo "image=$ECR_REGISTRY/y-so-cereal-dev-${SERVICE}:${IMAGE_TAG}" >> $GITHUB_OUTPUT

      # ---------------------------------------------------------------
      # ECR 이미지 취약점 스캔 게이트
      # CRITICAL 또는 HIGH 취약점 발견 시 배포 차단
      # ---------------------------------------------------------------
      - name: Wait for ECR scan results
        if: matrix.enabled == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          echo "Waiting for ECR scan to complete for ${SERVICE}:${IMAGE_TAG}..."
          for i in $(seq 1 20); do
            STATUS=$(aws ecr describe-image-scan-findings \
              --repository-name y-so-cereal-dev-${SERVICE} \
              --image-id imageTag=${IMAGE_TAG} \
              --region ${{ env.AWS_REGION }} \
              --query 'imageScanStatus.status' \
              --output text 2>/dev/null || echo "IN_PROGRESS")
            echo "Scan status: ${STATUS} (attempt ${i}/20)"
            if [ "$STATUS" = "COMPLETE" ]; then
              break
            fi
            sleep 15
          done

      - name: Check ECR scan results - block on CRITICAL/HIGH
        if: matrix.enabled == 'true'
        env:
          IMAGE_TAG: ${{ github.sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          FINDINGS=$(aws ecr describe-image-scan-findings \
            --repository-name y-so-cereal-dev-${SERVICE} \
            --image-id imageTag=${IMAGE_TAG} \
            --region ${{ env.AWS_REGION }} \
            --query 'imageScanFindings.findingSeverityCounts' \
            --output json)

          echo "Scan findings: ${FINDINGS}"

          CRITICAL=$(echo $FINDINGS | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('CRITICAL', 0))")
          HIGH=$(echo $FINDINGS | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('HIGH', 0))")

          echo "CRITICAL: ${CRITICAL}, HIGH: ${HIGH}"

          if [ "$CRITICAL" -gt "0" ] || [ "$HIGH" -gt "0" ]; then
            echo "❌ Deployment blocked: Found ${CRITICAL} CRITICAL and ${HIGH} HIGH vulnerabilities in ${SERVICE}"
            exit 1
          fi

          echo "✅ No CRITICAL or HIGH vulnerabilities found in ${SERVICE}. Proceeding with deployment."

      # ---------------------------------------------------------------
      # ECS 배포
      # ---------------------------------------------------------------
      - name: Download current task definition
        if: matrix.enabled == 'true'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          aws ecs describe-task-definition \
            --task-definition y-so-cereal-dev-${SERVICE} \
            --query taskDefinition \
            > task-definition.json

      - name: Update ECS task definition with new image
        if: matrix.enabled == 'true'
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: y-so-cereal-dev-${{ matrix.service }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        if: matrix.enabled == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: y-so-cereal-dev-${{ matrix.service }}-service
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
