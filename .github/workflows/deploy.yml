name: Deploy to ECS

on:
  push:
    branches:
      - main    # dev 배포
      - prod    # prod 배포
    paths:
      - "src/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "ap-northeast-2"

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      cart:        ${{ steps.filter.outputs.cart }}
      catalog:     ${{ steps.filter.outputs.catalog }}
      checkout:    ${{ steps.filter.outputs.checkout }}
      orders:      ${{ steps.filter.outputs.orders }}
      ui:          ${{ steps.filter.outputs.ui }}
      environment: ${{ github.ref == 'refs/heads/prod' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cart:
              - 'src/cart/**'
            catalog:
              - 'src/catalog/**'
            checkout:
              - 'src/checkout/**'
            orders:
              - 'src/orders/**'
            ui:
              - 'src/ui/**'

  deploy-cart:
    name: Build & Deploy - cart
    needs: changes
    if: needs.changes.outputs.cart == 'true'
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: cart
      environment: ${{ needs.changes.outputs.environment }}
    secrets: inherit

  deploy-catalog:
    name: Build & Deploy - catalog
    needs: changes
    if: needs.changes.outputs.catalog == 'true'
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: catalog
      environment: ${{ needs.changes.outputs.environment }}
    secrets: inherit

  deploy-checkout:
    name: Build & Deploy - checkout
    needs: changes
    if: needs.changes.outputs.checkout == 'true'
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: checkout
      environment: ${{ needs.changes.outputs.environment }}
    secrets: inherit

  deploy-orders:
    name: Build & Deploy - orders
    needs: changes
    if: needs.changes.outputs.orders == 'true'
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: orders
      environment: ${{ needs.changes.outputs.environment }}
    secrets: inherit

  deploy-ui:
    name: Build & Deploy - ui
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    uses: ./.github/workflows/deploy-service.yml
    with:
      service: ui
      environment: ${{ needs.changes.outputs.environment }}
    secrets: inherit
